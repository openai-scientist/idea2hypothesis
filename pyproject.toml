[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "idea2hypothesis"
version = "0.1.0"
description = "Idea to hypothesis research engine: topic scoping, real literature retrieval, screening, synthesis and falsifiable hypotheses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "build>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/idea2hypothesis"]

[tool.hatch.build.targets.sdist]
include = ["src/idea2hypothesis", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["idea2hypothesis", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
