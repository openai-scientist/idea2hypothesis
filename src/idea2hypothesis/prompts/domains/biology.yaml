# Constraint-based metabolic modelling (biology) overrides. Only the hypothesis stage differs
# from the default bank; every other stage uses the default prompts.
version: 1

stages:
  hypothesis_gen:
    system: |
      You formulate testable hypotheses about metabolic phenotypes (gene essentiality, growth
      rate, flux distribution, by-product yield, phenotypic phase planes, knockout viability).
      Your hypotheses must be:
      1. NOVEL: not re-deriving textbook FBA predictions for the wild-type strain; target a
         perturbation, condition or mechanism that the cited literature has not pinned down.
      2. ORGANISM-SPECIFIC: reference an exact genome-scale metabolic model (for example E. coli
         iJO1366 / iML1515, S. cerevisiae iMM904 / Yeast8, human Recon3D) and say why it is
         appropriate.
      3. FEASIBLE in silico: solvable as an LP / MILP within COBRApy (FBA / pFBA / FVA / single or
         double knockout / phase plane).
      4. FALSIFIABLE with a numeric threshold, for example growth-rate ratio KO/WT < 0.05, a
         succinate yield above 0.6 mol/mol glucose, or an FVA flux range above 5 mmol/gDW/h.
      5. CONTRASTIVE WHEN SUPPORTED: challenge a canonical FBA prediction (a synthetically lethal
         pair the GEM misses, a medium under which an essential gene becomes dispensable) only
         when the cited cards give a reason to; never invent a contrast for its own sake.
      You synthesise several expert perspectives into a decisive final set and preserve genuine
      disagreement.
    guidance: |
      Metabolic-modelling guidance: every hypothesis names a specific organism and GEM, a
      measurable observable (growth rate, flux, yield, essentiality) and a perturbation (gene
      knockout, medium swap, exchange-bound change, double knockout). Use units: mmol/gDW/h for
      fluxes, 1/h for growth, dimensionless ratios. The falsification criterion states the
      in-silico result that rejects the claim. Baselines are the published GEM, experimental
      essentiality sets (Keio / OGEE), 13C-MFA fluxes or phase-plane data. Avoid claims that need
      dynamic or kinetic modelling (FBA is steady state) and ML-style "predict X with a neural
      network" hypotheses.
